//Sửa lại ip public và đường dẫn của ansible_ssh_private_key_file để trỏ đến file khóa riêng tư của Jenkins
[jenkins]
jenkins-server ansible_host=0.0.0.0 ansible_user=ubuntu ansible_ssh_private_key_file=../jenkins-key.pem

//Sửa lại đường dẫn của ansible_python_interpreter để trỏ đến môi trường ảo của Ansible
[control]
localhost ansible_connection=local ansible_python_interpreter=/home/ubuntu/ansible-venv/bin/python

[all:vars]
ansible_python_interpreter=/usr/bin/python3

